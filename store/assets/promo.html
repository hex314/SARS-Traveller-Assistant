<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 30px;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    color: #0d1a22;
    background:
      radial-gradient(360px 240px at 8% 0%, #dff1e6 0%, rgba(223, 241, 230, 0) 62%),
      radial-gradient(320px 220px at 100% 100%, #dce7fb 0%, rgba(220, 231, 251, 0) 60%),
      #f5f8fa;
  }
  img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 10px 22px rgba(15, 60, 40, 0.18); }
  h1 { margin: 0 0 8px; font-size: 23px; letter-spacing: 0.2px; }
  p { margin: 0; font-size: 13.5px; line-height: 1.55; color: #4c5b68; }
  .tag {
    display: inline-block;
    margin-top: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    background: #12894a;
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <img src="../../icons/icon128.png" alt="">
  <div>
    <h1>南非入境申报助手</h1>
    <p>多人批量填写南非海关旅客申报表<br>三步流程自动完成</p>
    <span class="tag">一次录入 · 自动翻页</span>
  </div>
</body>
</html>
